<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none" class="brand-logo-svg">
  <defs>
    <linearGradient id="wfTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F8B8D"/>
      <stop offset="100%" stop-color="#086D70"/>
    </linearGradient>
  </defs>
  <!-- Triple Chevron / Origami Diamond Wings Symbol -->
  <g transform="translate(5, 12)">
    <!-- Left Chevron -->
    <path d="M0,45 L14,12 L28,45 L20,45 L14,28 L8,45 Z" fill="url(#wfTealGrad)"/>
    <path d="M8,48 L14,35 L20,48 L14,60 Z" fill="#086D70"/>
    
    <!-- Middle Chevron (Elevated) -->
    <path d="M22,42 L38,6 L54,42 L45,42 L38,24 L31,42 Z" fill="url(#wfTealGrad)"/>
    <path d="M31,45 L38,30 L45,45 L38,58 Z" fill="#05484B"/>
    
    <!-- Right Chevron -->
    <path d="M48,45 L62,12 L76,45 L68,45 L62,28 L56,45 Z" fill="url(#wfTealGrad)"/>
    <path d="M56,48 L62,35 L68,48 L62,60 Z" fill="#086D70"/>
  </g>

  <!-- Bilingual Brand Typography -->
  <g transform="translate(95, 0)">
    <!-- Arabic Header: القوات العاملة -->
    <text x="0" y="24" font-family="'Noto Sans Arabic', 'IBM Plex Sans Arabic', sans-serif" font-size="18" font-weight="700" fill="#151E22" letter-spacing="0.5">القوات العاملة</text>
    
    <!-- English Primary: WORKFORCE -->
    <text x="0" y="52" font-family="'Inter', system-ui, sans-serif" font-size="25" font-weight="800" fill="#151E22" letter-spacing="1.8">WORKFORCE</text>
    
    <!-- Subtitle: SAUDIA | السعودية -->
    <text x="0" y="72" font-family="'Inter', 'Noto Sans Arabic', sans-serif" font-size="12" font-weight="700" fill="#151E22" letter-spacing="1.2">SAUDIA <tspan font-weight="400" fill="#0F8B8D">|</tspan> <tspan font-family="'Noto Sans Arabic', sans-serif" font-weight="700">السعودية</tspan></text>
  </g>
</svg>
